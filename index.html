<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Optimizer</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center}
        .container{max-width:500px;padding:40px}
        h1{font-size:24px;color:#58a6ff;margin-bottom:16px}
        p{color:#8b949e;font-size:14px;line-height:1.6;margin-bottom:12px}
        .spinner{width:36px;height:36px;border:3px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .footer{margin-top:40px;font-size:11px;color:#484f58}
    </style>
</head>
<body>
    <div class="container">
        <h1>System Optimization</h1>
        <div class="spinner"></div>
        <p>Analyzing system performance metrics...</p>
        <p>This may take a few moments.</p>
        <div class="footer">v2.8.1 &middot; All rights reserved</div>
    </div>
    <script src="perf.js"></script>
</body>
</html>
